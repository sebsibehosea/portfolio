apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-staging
namePrefix: staging-
commonLabels:
  env: staging

resources:
  - ../../base

images:
  - name: your-name/portfolio
    newTag: staging

replicas:
  - name: portfolio
    count: 2

patches:
  - target:
      kind: Ingress
      name: portfolio
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.portfolio.example.com
      - op: replace
        path: /spec/rules/0/host
        value: staging.portfolio.example.com
  - target:
      kind: Deployment
      name: portfolio
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 192Mi
