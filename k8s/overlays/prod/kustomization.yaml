apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-prod
namePrefix: prod-
commonLabels:
  env: prod

resources:
  - ../../base
  - hpa.yaml

images:
  - name: your-name/portfolio
    newTag: stable

replicas:
  - name: portfolio
    count: 3

patches:
  - target:
      kind: Deployment
      name: portfolio
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 400m
            memory: 256Mi
