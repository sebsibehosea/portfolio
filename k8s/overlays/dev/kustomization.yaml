apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio-dev
namePrefix: dev-
commonLabels:
  env: dev

resources:
  - ../../base

images:
  - name: your-name/portfolio
    newTag: dev

replicas:
  - name: portfolio
    count: 1

patches:
  - target:
      kind: Ingress
      name: portfolio
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: dev.portfolio.example.com
      - op: replace
        path: /spec/rules/0/host
        value: dev.portfolio.example.com
