version: "3.9"

services:
  portfolio:
    build: .
    image: your-name/portfolio:local
    container_name: portfolio
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
